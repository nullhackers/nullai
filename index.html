<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b10" />
  <meta name="description"
    content="Discover your next unfair advantage. Explore a curated directory of AI tools for creativity, coding, research, and everyday work." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>NullAI — Discover the best AI tools</title>
  <script>
    try {
      let t = localStorage.getItem("nullai-theme");
      document.documentElement.dataset.theme =
        t ||
        (matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark");
    } catch {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
